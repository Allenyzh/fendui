name: Check GitHub Pages build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: my-app/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: my-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - name: Verify committed Pages artifacts
        run: pnpm check:pages
      - name: Build static export
        run: pnpm build
